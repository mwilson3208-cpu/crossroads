<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Source for assets/img/og-default.jpg (1200x630), the image shown when a page is shared. Rebuild with npm run images. -->
<style>
@font-face { font-family: Fraunces; font-weight: 700; src: url('../assets/fonts/fraunces-700-latin.woff2') format('woff2'); }
@font-face { font-family: Inter; font-weight: 400 700; src: url('../assets/fonts/inter-latin.woff2') format('woff2'); }
html, body { margin: 0; }
body { width: 1200px; height: 630px; background: #14213D; color: #FAF8F3; font-family: Inter, sans-serif; position: relative; overflow: hidden; }
.brandbar { position: absolute; left: 0; right: 0; top: 0; height: 168px; background: #FFFFFF; display: flex; align-items: center; padding: 0 80px; }
.brandbar img { height: 104px; width: auto; }
.wrap { position: absolute; inset: 216px 80px 64px; display: flex; flex-direction: column; }
h1 { font-family: Fraunces, serif; font-size: 62px; line-height: 1.06; margin: 0; max-width: 980px; letter-spacing: -.01em; }
p { margin: 28px 0 0; font-size: 26px; color: #8FD3CD; font-weight: 700; letter-spacing: .02em; }
</style></head>
<body>
<div class="brandbar"><img src="crossroads-logo-full.png" alt=""></div>
<div class="wrap">
  <h1>Leaders are not born in the Valley by accident. Somebody builds them.</h1>
  <p>Rio Grande Valley, Texas &nbsp;|&nbsp; 501(c)(3) nonprofit</p>
</div>
</body></html>
