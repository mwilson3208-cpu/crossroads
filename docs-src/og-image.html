<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Source for assets/img/og-default.jpg (1200x630), the image shown when a page is shared. Rebuild with npm run images. -->
<style>
@font-face { font-family: Fraunces; font-weight: 700; src: url('../assets/fonts/fraunces-700-latin.woff2') format('woff2'); }

.brand b { font-family: Fraunces, serif; font-size: 40px; display: block; line-height: 1; }

h1 { font-family: Fraunces, serif; font-size: 66px; line-height: 1.06; margin: auto 0 0; max-width: 900px; letter-spacing: -.01em; }
